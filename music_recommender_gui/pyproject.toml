[project]
name = "music-recommender"
version = "0.1.0"
description = "PyQt6 GUI to train and use a KNN music recommender (Spotify Tracks Dataset)"
readme = "README.md"
authors = [
    { name = "ashish-um", email = "ashishumrao632005@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pyqt6>=6.11.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "streamlit>=1.40.0",
    "yt-dlp>=2025.1.15",
]

[project.scripts]
music-recommender = "music_recommender.gui.app:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:vert. bool was deprecated:DeprecationWarning:seaborn"]
